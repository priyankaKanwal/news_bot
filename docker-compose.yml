# Start with `docker compose up -d`; data persists in named volumes.
# `docker compose down -v` also deletes stored data.
# Qdrant dashboard: http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: news_bot_qdrant
    ports:
      - "6333:6333"   # REST API + dashboard
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: news_bot_postgres
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_bot}
      POSTGRES_USER: ${POSTGRES_USER:-news_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_bot_dev}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news_bot} -d ${POSTGRES_DB:-news_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_storage:
