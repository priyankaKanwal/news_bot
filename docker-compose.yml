# Qdrant vector database as a server.
#
#   docker compose up -d      start (data is kept in the named volume)
#   docker compose down       stop (data is kept)
#   docker compose down -v    stop AND delete all stored vectors
#
# Dashboard: http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: news_bot_qdrant
    ports:
      - "6333:6333"   # REST API + dashboard
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
